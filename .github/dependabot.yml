version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"

      gomod-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  # Hash-pinned test and schema-validator environments bootstrapped by
  # scripts/validate_ci_tier.sh. Updates must keep the --require-hashes
  # contract intact.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      python:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security:
        applies-to: security-updates
        patterns: ['*']
