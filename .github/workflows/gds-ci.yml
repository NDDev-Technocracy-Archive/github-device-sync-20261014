# Repository-owned CI. The anchor declares no ci.workflow_ref, so gds does
# not generate this file; the commands below are the anchor's
# verification.commands and must change together with .gds/repository.yaml.
name: gds-ci

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: gds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: GDS fast
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - name: Verify Go toolchain
        run: |
          actual="$(go env GOVERSION)"
          [[ "$actual" == go1.27.3 || "$actual" == go1.27.3.* ]]
      # Declared fast commands own their build scope; the complete build runs
      # in the PR-required job.
      - name: Fast checks
        run: scripts/validate_shell.sh && scripts/validate_go_core.sh --fast

  pr-required:
    name: GDS PR required
    # The fast checks run first so this job only spends time on code that
    # already passes them.
    needs: fast
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      # requirements/test.txt is compiled for Python 3.12 with hashes.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: go build -trimpath ./core/cmd/gds
      - name: PR-required tests
        run: |
          go test ./...
          python3 -m pip install --quiet --require-hashes -r requirements/test.txt
          python3 -m pytest
