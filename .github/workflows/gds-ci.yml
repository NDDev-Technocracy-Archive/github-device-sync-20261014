name: gds-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gds-ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.2
        cache: false
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        ecosystems: go
    - name: Build
      shell: bash
      run: |2+

    - name: Test
      shell: bash
      run: |
        scripts/validate_shell.sh && scripts/validate_go_core.sh --fast
  pr-required:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.2
        cache: false
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        ecosystems: go
    - name: Build
      shell: bash
      run: |
        go build -trimpath ./core/cmd/gds
    - name: Test
      shell: bash
      run: |
        go test ./... && python3 -m pip install --quiet --require-hashes -r requirements/test.txt && python3 -m pytest
